# Конфигурация ruff. Отдельного пакета проект не собирает — это только настройки проверок.
#
# Правила выбраны так, чтобы ловить настоящие ошибки, а не спорить о вкусах:
# непойманные исключения, забытые переменные, порядок импортов, устаревшие конструкции.
# Придирки к магическим числам и длине функций сознательно не включены — они
# отпугивают тех, кто впервые присылает правку.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",      # стиль pycodestyle
    "F",           # неиспользованное и неопределённое (pyflakes)
    "I",           # порядок импортов
    "UP",          # устаревшие конструкции
    "B",           # частые ловушки (flake8-bugbear)
    "SIM",         # упрощения
    "C4",          # генераторы вместо промежуточных списков
    "RET",         # лишние return
    "BLE",         # except Exception без разбора
    "ARG",         # неиспользованные аргументы
    "PLC0415",     # импорт не наверху файла — у нас это осознанный приём, помечаем явно
    "PLE", "PLW",  # ошибки и предупреждения pylint
    "RUF",
    "ANN001",      # аргументы без типов
]

# Кириллица в комментариях и строках — не «подозрительные символы». Проект русскоязычный,
# без этого исключения проверка выдаёт 281 ложное срабатывание и становится бесполезной.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Замеры и установщик моделей грузят тяжёлые библиотеки по требованию: держать
# onnxruntime в шапке файла означает ждать его импорта даже там, где он не нужен.
"bench/*" = ["PLC0415"]
"tools/*" = ["PLC0415"]
